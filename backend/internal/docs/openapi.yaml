openapi: 3.1.0
info:
  title: Muhfarming API
  version: 1.0.0
  description: |
    REST API for the Muhfarming backend. Provides CRUD operations for all
    domain entities (farms, regions, fields, crops, cultivations, and related
    records), plus a health check and a weather forecast proxy.

    ## Conventions
    - All persisted entities embed common fields from the ORM base model:
      `ID`, `CreatedAt`, `UpdatedAt`, `DeletedAt` (note the capitalized keys;
      entity-specific fields use camelCase).
    - Foreign keys are exposed both as an id field (e.g. `farmId`) and, on
      read/create/update responses, as a nested association object
      (e.g. `farm`).
    - **Soft deletes:** `DELETE` returns `204 No Content`. The row is not
      physically removed — its `DeletedAt` is set and it is excluded from all
      subsequent reads (a later `GET` of that id returns `404`).
    - Validation failures return `400` with a structured body listing the
      offending fields.

servers:
  - url: /
    description: The server that served this page. "Try it out" sends requests to the same host/port you loaded /docs from (e.g. http://localhost:8080 locally, or the deployed host). The API listens on port 8080 on all interfaces.

tags:
  - name: Farms
  - name: Regions
  - name: Cultivations
  - name: Fertilizers
  - name: Hazards
  - name: Fields
  - name: Field Coordinates
  - name: Crops
  - name: Cultivation Guidelines
  - name: Cultivation Risks
  - name: Incidents
  - name: Alerts
  - name: Users
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /forecast:
    get:
      tags: [System]
      summary: Weather forecast for a location derived from an IP address
      operationId: getForecast
      parameters:
        - name: ip
          in: query
          required: true
          description: IPv4/IPv6 address to geolocate
          schema:
            type: string
            format: ip
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-01"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-07"
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

