components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Numeric identifier
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InvalidId:
      description: The path id was not a valid integer
      content:
        text/plain:
          schema:
            type: string
            example: invalid id
    NotFound:
      description: No record with that id (also returned for soft-deleted records)
      content:
        text/plain:
          schema:
            type: string
            example: not found
    Deleted:
      description: Deleted (soft delete). No response body.
    FarmResponse:
      description: A farm
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Farm" }
    RegionResponse:
      description: A region
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Region" }
    CultivationResponse:
      description: A cultivation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cultivation" }
    FertilizerResponse:
      description: A fertilizer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Fertilizer" }
    HazardResponse:
      description: A hazard
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hazard" }
    FieldResponse:
      description: A field
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Field" }
    FieldCoordinateResponse:
      description: A field coordinate
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldCoordinate" }
    CropResponse:
      description: A crop
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Crop" }
    CultivationGuidelineResponse:
      description: A cultivation guideline
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CultivationGuideline" }
    CultivationRiskResponse:
      description: A cultivation risk
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CultivationRisk" }
    IncidentResponse:
      description: An incident
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Incident" }
    AlertResponse:
      description: An alert
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Alert" }
    UserResponse:
      description: A user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }

  requestBodies:
    FarmBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FarmRequest" }
    RegionBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegionRequest" }
    CultivationBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CultivationRequest" }
    FertilizerBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FertilizerRequest" }
    HazardBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HazardRequest" }
    FieldBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldRequest" }
    FieldCoordinateBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldCoordinateRequest" }
    CropBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CropRequest" }
    CultivationGuidelineBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CultivationGuidelineRequest" }
    CultivationRiskBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CultivationRiskRequest" }
    IncidentBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IncidentRequest" }
    AlertBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AlertRequest" }
    UserBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserRequest" }

  schemas:
    Base:
      type: object
      description: Fields common to every persisted entity (from the ORM base model).
      properties:
        ID:
          type: integer
          format: int64
          readOnly: true
          example: 1
        CreatedAt:
          type: string
          format: date-time
          readOnly: true
        UpdatedAt:
          type: string
          format: date-time
          readOnly: true
        DeletedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: Name
              message:
                type: string
                example: field is required

    # ---- Farm ----
    Farm:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Green Valley Farm }
    FarmRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Green Valley Farm }

    # ---- Region ----
    Region:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Bavaria }
            geoCode: { type: string, example: DE-BY }
    RegionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Bavaria }
        geoCode: { type: string, example: DE-BY }

    # ---- Cultivation ----
    Cultivation:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Winter Wheat }
            estTimeToHarvestWeeks: { type: integer, example: 36 }
    CultivationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Winter Wheat }
        estTimeToHarvestWeeks: { type: integer, example: 36 }

    # ---- Fertilizer ----
    Fertilizer:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Nitrogen Mix N-20 }
    FertilizerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Nitrogen Mix N-20 }

    # ---- Hazard ----
    Hazard:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Flood }
            description: { type: string, example: Excess water from heavy rain }
    HazardRequest:
      type: object
      required: [name, description]
      properties:
        name: { type: string, example: Flood }
        description: { type: string, example: Excess water from heavy rain }

    # ---- Field ----
    Field:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: North Field }
            fieldNotes: { type: string, example: Loamy soil }
            farmId: { type: integer, format: int64, example: 1 }
            farm: { $ref: "#/components/schemas/Farm" }
            regionId: { type: integer, format: int64, example: 1 }
            region: { $ref: "#/components/schemas/Region" }
    FieldRequest:
      type: object
      required: [name, farmId, regionId]
      properties:
        name: { type: string, example: North Field }
        fieldNotes: { type: string, example: Loamy soil }
        farmId: { type: integer, format: int64, example: 1 }
        regionId: { type: integer, format: int64, example: 1 }

    # ---- FieldCoordinate ----
    FieldCoordinate:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            latitude: { type: number, format: double, example: 48.137 }
            longitude: { type: number, format: double, example: 11.575 }
            sequenceOrder: { type: integer, example: 1 }
            fieldId: { type: integer, format: int64, example: 1 }
            field: { $ref: "#/components/schemas/Field" }
    FieldCoordinateRequest:
      type: object
      required: [latitude, longitude, fieldId]
      properties:
        latitude: { type: number, format: double, example: 48.137 }
        longitude: { type: number, format: double, example: 11.575 }
        sequenceOrder: { type: integer, example: 1 }
        fieldId: { type: integer, format: int64, example: 1 }

    # ---- Crop ----
    Crop:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            status: { type: string, example: Growing }
            datePlanted: { type: string, example: "2026-03-01" }
            lastUpdated: { type: string, example: "2026-08-07" }
            fieldId: { type: integer, format: int64, example: 1 }
            field: { $ref: "#/components/schemas/Field" }
            cultivationId: { type: integer, format: int64, example: 1 }
            cultivation: { $ref: "#/components/schemas/Cultivation" }
    CropRequest:
      type: object
      required: [fieldId, cultivationId]
      properties:
        status: { type: string, example: Growing }
        datePlanted: { type: string, example: "2026-03-01" }
        lastUpdated: { type: string, example: "2026-08-07" }
        fieldId: { type: integer, format: int64, example: 1 }
        cultivationId: { type: integer, format: int64, example: 1 }

    # ---- CultivationGuideline ----
    CultivationGuideline:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            type: { type: string, example: Fertilizing }
            weekFrom: { type: integer, example: 4 }
            weekTo: { type: integer, example: 8 }
            instructions: { type: string, example: Apply nitrogen }
            cultivationId: { type: integer, format: int64, example: 1 }
            cultivation: { $ref: "#/components/schemas/Cultivation" }
            fertilizerId:
              type: [integer, "null"]
              format: int64
              example: 1
            fertilizer:
              oneOf:
                - $ref: "#/components/schemas/Fertilizer"
                - type: "null"
    CultivationGuidelineRequest:
      type: object
      required: [cultivationId]
      properties:
        type: { type: string, example: Fertilizing }
        weekFrom: { type: integer, example: 4 }
        weekTo: { type: integer, example: 8 }
        instructions: { type: string, example: Apply nitrogen }
        cultivationId: { type: integer, format: int64, example: 1 }
        fertilizerId:
          type: [integer, "null"]
          format: int64
          description: Optional (nullable) foreign key
          example: 1

    # ---- CultivationRisk ----
    CultivationRisk:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            weekFrom: { type: integer, example: 10 }
            weekTo: { type: integer, example: 20 }
            solution: { type: string, example: Improve drainage }
            cultivationId: { type: integer, format: int64, example: 1 }
            cultivation: { $ref: "#/components/schemas/Cultivation" }
            hazardId: { type: integer, format: int64, example: 1 }
            hazard: { $ref: "#/components/schemas/Hazard" }
    CultivationRiskRequest:
      type: object
      required: [cultivationId, hazardId]
      properties:
        weekFrom: { type: integer, example: 10 }
        weekTo: { type: integer, example: 20 }
        solution: { type: string, example: Improve drainage }
        cultivationId: { type: integer, format: int64, example: 1 }
        hazardId: { type: integer, format: int64, example: 1 }

    # ---- Incident ----
    Incident:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            date: { type: string, example: "2026-07-15" }
            priority: { type: string, example: High }
            description: { type: string, example: Flooding in low areas }
            cultivationRiskId: { type: integer, format: int64, example: 1 }
            cultivationRisk: { $ref: "#/components/schemas/CultivationRisk" }
            regionId: { type: integer, format: int64, example: 1 }
            region: { $ref: "#/components/schemas/Region" }
    IncidentRequest:
      type: object
      required: [cultivationRiskId, regionId]
      properties:
        date: { type: string, example: "2026-07-15" }
        priority: { type: string, example: High }
        description: { type: string, example: Flooding in low areas }
        cultivationRiskId: { type: integer, format: int64, example: 1 }
        regionId: { type: integer, format: int64, example: 1 }

    # ---- Alert ----
    Alert:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            fieldId: { type: integer, format: int64, example: 1 }
            field: { $ref: "#/components/schemas/Field" }
            incidentId: { type: integer, format: int64, example: 1 }
            incident: { $ref: "#/components/schemas/Incident" }
    AlertRequest:
      type: object
      required: [fieldId, incidentId]
      properties:
        fieldId: { type: integer, format: int64, example: 1 }
        incidentId: { type: integer, format: int64, example: 1 }

    # ---- User ----
    User:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            name: { type: string, example: Hans }
            surname: { type: string, example: Bauer }
            title: { type: string, example: Mr }
            email: { type: string, format: email, example: hans@greenvalley.de }
            language: { type: string, example: de }
            role: { type: string, enum: [Admin, Farmer], example: Farmer }
            farmId: { type: integer, format: int64, example: 1 }
            farm: { $ref: "#/components/schemas/Farm" }
    UserRequest:
      type: object
      required: [name, email, role, farmId]
      properties:
        name: { type: string, example: Hans }
        surname: { type: string, example: Bauer }
        title: { type: string, example: Mr }
        email: { type: string, format: email, example: hans@greenvalley.de }
        language: { type: string, example: de }
        role: { type: string, enum: [Admin, Farmer], example: Farmer }
        farmId: { type: integer, format: int64, example: 1 }

    # ---- Weather ----
    ForecastResponse:
      type: object
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        generationtime_ms: { type: number, format: double }
        utc_offset_seconds: { type: integer }
        timezone: { type: string }
        timezone_abbreviation: { type: string }
        elevation: { type: number, format: double }
        hourly_units:
          type: object
          properties:
            time: { type: string }
            temperature_2m: { type: string }
        hourly:
          type: object
          properties:
            time:
              type: array
              items: { type: string }
            temperature_2m:
              type: array
              items: { type: number, format: double }
