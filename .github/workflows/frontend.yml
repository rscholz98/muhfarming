name: Android Deploy

on:
  push:
    branches: [main]
    paths:
      - "muhfarming/**"
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: muhfarming-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E1LK126VJQQC8J

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: muhfarming
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: muhfarming
        run: ./gradlew assembleDebug

      - name: Find APK
        run: find muhfarming -type f -name "*.apk"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload APK to S3
        run: |
          aws s3 cp \
            muhfarming/app/build/outputs/apk/debug/app-debug.apk \
            s3://${{ env.S3_BUCKET }}/app/app-debug.apk \
            --content-type application/vnd.android.package-archive

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/app/app-debug.apk"
